# Deployed from ArbiterMate (server/public-repo); edit it there.
# Hourly: reads every WoW Forever auction house with the server ArbiterMate's CI
# deployed (the "server" release), carrying each house's state from run to run, and
# publishes the feed companions download (the "feed" release).
#
# Started only from outside: cron-job.org calls GitHub's API (a workflow_dispatch) at
# 17 past every hour (UTC), and it can be run by hand. Nothing here schedules or
# starts another run.
name: Poll

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One poll at a time, none dropped: each carries the last one's state forward.
    concurrency:
      group: poll
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Get the server and the last run's state
        run: |
          gh release download server -p arbitermate-server
          chmod +x arbitermate-server
          mkdir -p state
          if gh release download feed -p state.tar.gz; then tar xzf state.tar.gz; fi

      - name: Poll every auction house
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: ${{ vars.BLIZZARD_REGION || 'us' }}
        run: ./arbitermate-server state feed.json | tee status.txt

      - name: Publish the feed
        run: |
          tar czf state.tar.gz state
          gh release view feed >/dev/null 2>&1 || gh release create feed --latest=false --title "Feed" \
            --notes "Hourly sales feed for ArbiterMate companions (feed.json), and the poller's state."
          gh release upload feed feed.json state.tar.gz --clobber
